name: Build and deploy Node.js backend to Azure Web App - backend-pos

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm install --no-audit --no-fund

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Prepare deployment artifact
        run: |
          rm -rf deploy
          mkdir -p deploy
          node <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('backend/package.json', 'utf8'));
          delete pkg.devDependencies;
          delete pkg.scripts.dev;
          delete pkg.scripts.build;
          delete pkg.scripts.lint;
          pkg.scripts = { start: 'node dist/index.js' };
          fs.writeFileSync('deploy/package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE
          cp -R backend/dist deploy/dist

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-backend
          path: deploy

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: node-backend
          path: deploy

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'backend-pos'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_24F7AD2F94DF4F7CBC91D372B97997EB }}
          package: deploy
