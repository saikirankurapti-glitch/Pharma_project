name: Pharmacy POS QA - Automated E2E

on:
  workflow_dispatch:
  push:
    branches: [ "qa/functional-testing" ]
  pull_request:
    branches: [ "main" ]

jobs:
  api-e2e:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --replSet rs0
          --bind_ip_all

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend
        working-directory: backend
        run: npm ci

      - name: Initialize MongoDB replica set
        working-directory: backend
        run: |
          node - <<'NODE'
          const { MongoClient } = require('mongodb');
          const sleep = ms => new Promise(r => setTimeout(r, ms));
          (async () => {
            const uri = 'mongodb://127.0.0.1:27017/?directConnection=true';
            const client = new MongoClient(uri);
            await client.connect();
            try {
              try { await client.db('admin').command({ replSetInitiate: { _id: 'rs0', members: [{ _id: 0, host: '127.0.0.1:27017' }] } }); } catch (e) {
                if (!String(e.message).includes('already initialized')) throw e;
              }
            } finally { await client.close(); }
            for (let i = 0; i < 20; i++) {
              const c = new MongoClient('mongodb://127.0.0.1:27017/?replicaSet=rs0');
              try { await c.connect(); await c.db('admin').command({ ping: 1 }); await c.close(); process.exit(0); } catch (e) { try { await c.close(); } catch {} await sleep(1000); }
            }
            process.exit(1);
          })().catch(e => { console.error(e); process.exit(1); });
          NODE

      - name: Seed products
        working-directory: backend
        env:
          MONGO_URI: mongodb://127.0.0.1:27017/genquantaa_pharmacy_qa
          PORT: 5000
          JWT_SECRET: qa-jwt-secret
          JWT_REFRESH_SECRET: qa-refresh-secret
          NODE_ENV: test
        run: npx tsx src/seedMockData.ts

      - name: Prepare QA users and settings
        env:
          MONGO_URI: mongodb://127.0.0.1:27017/genquantaa_pharmacy_qa
          PORT: 5000
          JWT_SECRET: qa-jwt-secret
          JWT_REFRESH_SECRET: qa-refresh-secret
          NODE_ENV: test
        run: npx tsx backend/qa/setup.ts

      - name: Start backend
        working-directory: backend
        env:
          MONGO_URI: mongodb://127.0.0.1:27017/genquantaa_pharmacy_qa
          PORT: 5000
          JWT_SECRET: qa-jwt-secret
          JWT_REFRESH_SECRET: qa-refresh-secret
          NODE_ENV: test
          CLIENT_URL: http://localhost:5173
        run: |
          nohup npx tsx src/index.ts > /tmp/pharmacy-backend.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:5000/api/health && break || sleep 2; done

      - name: Run 30 E2E business journeys
        env:
          BASE_URL: http://127.0.0.1:5000/api
          MONGO_URI: mongodb://127.0.0.1:27017/genquantaa_pharmacy_qa
          JWT_SECRET: qa-jwt-secret
        run: |
          set -o pipefail
          node qa/pos-e2e.mjs | tee qa-results.json

      - name: Run all 181 automated test cases
        env:
          BASE_URL: http://127.0.0.1:5000/api
        run: python3 qa/all_181_runner.py

      - name: Upload comprehensive QA results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pharmacy-pos-all-181-results
          path: |
            all-181-results.json
            /tmp/pharmacy-backend.log

      - name: Upload QA results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pharmacy-pos-qa-results
          path: |
            qa-results.json
            /tmp/pharmacy-backend.log
